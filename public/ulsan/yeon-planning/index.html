<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연 학습 참고서 — 울산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: linear-gradient(180deg, #f8f5ef 0%, #f4f0e9 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}
.card {
  background: #fffdf8;
  border-radius: 32px;
  padding: 48px 36px;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 18px 48px rgba(37,49,49,0.10);
  border: 1px solid rgba(31,42,42,0.06);
  text-align: center;
}
.logo-icon {
  width: 72px; height: 72px;
  background: linear-gradient(135deg, rgba(47,93,98,0.14), rgba(195,141,86,0.14));
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px;
}
.badge {
  display: inline-block;
  background: rgba(47,93,98,0.10);
  color: #2f5d62;
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 14px;
  letter-spacing: 0.02em;
}
h1 {
  font-family: "Noto Serif KR", serif;
  font-size: 26px;
  color: #2f5d62;
  margin-bottom: 8px;
  line-height: 1.3;
}
.desc {
  font-size: 14px;
  color: #536060;
  line-height: 1.7;
  margin-bottom: 32px;
}
.btn-start {
  display: block;
  width: 100%;
  padding: 18px;
  background: #2f5d62;
  color: white;
  border: none;
  border-radius: 18px;
  font-family: "Pretendard", sans-serif;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
  margin-bottom: 12px;
}
.btn-start:hover { background: #427a71; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(47,93,98,0.25); }
.qr-section {
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid #d7d1c5;
}
.qr-label {
  font-size: 12px;
  color: #6a7676;
  margin-bottom: 10px;
}
.qr-img {
  border-radius: 12px;
  border: 1px solid #d7d1c5;
}
.rule-box {
  background: rgba(195,141,86,0.08);
  border: 1px solid rgba(195,141,86,0.20);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 28px;
  text-align: left;
}
.rule-title {
  font-size: 12px;
  font-weight: 700;
  color: #c38d56;
  margin-bottom: 8px;
}
.rule-item {
  font-size: 13px;
  color: #536060;
  line-height: 1.6;
  padding-left: 4px;
}
.rule-item + .rule-item { margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-icon">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2f5d62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
  </div>
  <div class="badge">연 학습 참고서 · 울산</div>
  <h1>궁금한 건 뭐든 물어봐</h1>
  <p class="desc">
    답을 주기보다 함께 생각하면서<br>
    스스로 발견하도록 도와주는 AI 참고서예요.<br>
    기말 자료도 만들어줍니다.
  </p>

  <div class="rule-box">
    <div class="rule-title">이용 규칙</div>
    <div class="rule-item">첫 과목은 무료로 시작해요.</div>
    <div class="rule-item">새 과목을 열 때마다 친구 1명을 초대해야 해요.</div>
    <div class="rule-item">초대한 친구가 첫 학습을 시작하면 바로 열려요.</div>
  </div>

  <a class="btn-start" href="https://curiosity-loop-theta.vercel.app" target="_blank">
    학습 시작하기
  </a>

  <div class="qr-section">
    <div class="qr-label">QR 코드로 바로 열기</div>
    <img class="qr-img"
      src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=https://curiosity-loop-theta.vercel.app&color=2f5d62&bgcolor=fffdf8"
      width="130" height="130" alt="QR 코드">
    <div style="font-size:11px;color:#6a7676;margin-top:8px;">curiosity-loop-theta.vercel.app</div>
  </div>
</div>
</body>
</html>
